name: Deploy SpringBoot to ECR

on:
  push:
    branches: [ "main" ]
    paths:
      - 'spring-boot/**' # 👈 중요: Spring Boot 폴더가 변할 때만 실행!

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        working-directory: ./spring-boot
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar # 👈 여기서 build/libs/ 아래에 JAR가 생성됨!

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: swimcolor-springboot # 👈 SpringBoot용 ECR 이름
          IMAGE_TAG: latest
        run: |
          # 👈 중요: Spring Boot 폴더 경로 지정!
          # 👈 -f 옵션으로 Dockerfile의 실제 경로를 알려주고, 빌드 범위는 루트(.)로 잡아!
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f ./spring-boot/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG