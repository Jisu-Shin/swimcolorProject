name: Deploy SpringBoot to ECR

on:
  push:
    branches: [ "main" ]
    paths:
      - 'spring-boot/**' # 👈 중요: Spring Boot 폴더가 변할 때만 실행!

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        working-directory: ./spring-boot
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar # 👈 여기서 build/libs/ 아래에 JAR가 생성됨!

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: swimcolor-springboot # 👈 SpringBoot용 ECR 이름
          IMAGE_TAG: latest
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -f ./spring-boot/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin 122015480273.dkr.ecr.ap-northeast-2.amazonaws.com
            docker pull 122015480273.dkr.ecr.ap-northeast-2.amazonaws.com/swimcolor-springboot:latest
            docker rm -f springboot-app
            docker run -d -p 8080:8080 \
              --name springboot-app \
              --env-file ~/.env \
              --restart unless-stopped \
              122015480273.dkr.ecr.ap-northeast-2.amazonaws.com/swimcolor-springboot:latest
            sleep 10
            docker ps | grep springboot-app